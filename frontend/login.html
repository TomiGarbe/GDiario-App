<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <title>Login - GDiario</title>
</head>
<body>
<section id="authGate" class="auth-gate" style="display:flex">
  <div class="auth-card">
    <p class="card-label">Acceso seguro</p>
    <h2>Iniciar sesión</h2>
    <p class="auth-sub">Debés iniciar sesión con Google para usar la app.</p>
    <div id="googleLoginBtn"></div>
    <p id="authMsg" class="auth-msg" style="display:none"></p>
  </div>
</section>

<div id="appRoot" style="display:none"></div>

<script src="./js/auth.js"></script>
<script src="./js/api.js"></script>
<script>
window.onload = function() {
  if (typeof inicializarAutenticacion === 'function') {
    inicializarAutenticacion();
  }
};
</script>
</body>
</html>
